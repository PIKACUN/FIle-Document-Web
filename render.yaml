services:
  - type: web
    name: penjelas-dokumen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: OWNER_EMAIL
        sync: false
      - key: GROQ_API_KEY
        sync: false
