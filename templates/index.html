<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penjelas Dokumen</title>
<meta name="description" content="Unggah PDF, TXT, atau foto dokumen. Penjelas Dokumen merangkum, menyorot hal penting, dan menjawab dengan rujukan ke kalimat sumbernya.">
<meta name="theme-color" content="#141414">
<meta property="og:type" content="website">
<meta property="og:title" content="Penjelas Dokumen">
<meta property="og:description" content="Pahami dokumen apa pun: ringkasan, sorotan bagian penting, dan jawaban dengan rujukan ke sumbernya.">
<meta property="og:image" content="https://pikacun.pythonanywhere.com/static/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141414'/%3E%3Cpath d='M12 6h13l-5 20H7z' fill='%23ff5fa2'/%3E%3C/svg%3E">
<script>document.documentElement.classList.add('js')</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --bg:#f5f5f4;--sheet:#ffffff;--step:#ebebe5;--ink:#141414;--mut:#5c5c58;--line:#dcdcd5;--line2:#b9b9b1;
  --marker:#ffe14d;--on-marker:#141414;--danger:#b8321f;--ok:#1d7a46;
  --field:#141414;--field-ink:#f5f5f4;--field-mut:#b4b4ae;
  --sans:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --ease-out:cubic-bezier(.22,1,.36,1);--ease-expo:cubic-bezier(.16,1,.3,1);--ease-in-out:cubic-bezier(.76,0,.24,1);
  --t-press:140ms;--t-hover:180ms;--t-ui:240ms;--t-reveal:800ms;--stagger:70ms;
  --gut:clamp(16px,2.4vw,32px);
}
:root[data-theme="dark"]{
  --bg:#101010;--sheet:#191919;--step:#222222;--ink:#f2f2ee;--mut:#a6a6a0;--line:#2c2c2c;--line2:#474747;
  --danger:#ff8a75;--ok:#5fd08f;--field:#1c1c1c;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101010;--sheet:#191919;--step:#222222;--ink:#f2f2ee;--mut:#a6a6a0;--line:#2c2c2c;--line2:#474747;
  --danger:#ff8a75;--ok:#5fd08f;--field:#1c1c1c;
}}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:80px;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-weight:600;letter-spacing:-.025em;line-height:1.05;margin:0}
h2{font-size:22px;letter-spacing:-.015em;margin-bottom:12px}
p{margin:0}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.note{font-size:14px;line-height:1.5;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.wrap{padding-inline:var(--gut)}

/* Tombol: stabilo yang menyapu dari kiri */
.btn{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:4px;padding:11px 20px;font-weight:600;line-height:1.2;white-space:nowrap;transition:color var(--t-hover) ease,border-color var(--t-hover) ease,transform var(--t-press) var(--ease-out)}
.btn:before{content:"";position:absolute;inset:-1px;z-index:-1;background:var(--marker);transform:scaleX(0);transform-origin:left;transition:transform 380ms var(--ease-out)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.danger{background:transparent;color:var(--danger);border-color:currentColor}
.btn.danger:before{background:var(--danger)}
.btn:disabled{opacity:.55;cursor:wait}
@media(hover:hover){
  .btn:hover,.btn:focus-visible{color:var(--on-marker);border-color:var(--marker)}
  .btn:hover:before,.btn:focus-visible:before{transform:scaleX(1)}
  .btn.danger:hover,.btn.danger:focus-visible{color:var(--bg);border-color:var(--danger)}
}

/* Bilah atas */
header{position:sticky;top:0;z-index:10;background:var(--bg);view-transition-name:site-header;transition:transform 420ms var(--ease-out)}
header.hide{transform:translateY(-100%)}
.bar{padding:12px var(--gut);display:flex;align-items:center;gap:10px;position:relative}
.logo{font-weight:700;letter-spacing:-.02em;background:none;border:0;font-size:17px;padding:0;display:flex;align-items:center;gap:9px}
.mark{width:18px;height:18px;background:var(--marker);transform:skewX(-14deg);transition:transform 400ms var(--ease-out)}
.logo:hover .mark{transform:skewX(-14deg) scaleX(1.45)}
.sp{flex:1}
.links{display:flex;gap:8px;align-items:center}
#burger{display:none}
.ai-pill{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;white-space:nowrap;color:var(--mut);padding-inline:6px}
.ai-pill:before{content:"";width:8px;height:8px;border-radius:50%;background:#c48212;transition:background var(--t-ui) ease}
.ai-pill.on{color:var(--ink)}.ai-pill.on:before{background:var(--ok)}
.ai-pill.off:before{background:var(--danger)}

main.app{max-width:1240px;margin:0 auto;padding:24px var(--gut) 56px}
footer{padding:18px var(--gut) 26px;color:var(--mut);font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
body.auth-page footer{display:none}

/* Kalimat dokumen dan sapuan stabilo */
.mk{background-image:linear-gradient(var(--marker),var(--marker));background-repeat:no-repeat;background-position:0 62%;background-size:100% 84%;color:var(--on-marker);padding:.06em .1em;margin-inline:-.1em;transition:background-size 760ms var(--ease-in-out),color 300ms ease}
.fl{background-image:linear-gradient(var(--marker),var(--marker));background-repeat:no-repeat;background-position:0 62%;background-size:100% 84%;color:var(--on-marker);outline:2px solid var(--ink);outline-offset:1px}
.paper{background:var(--sheet);border:1px solid var(--line);border-radius:4px;font:400 17px/1.7 var(--serif);padding:clamp(16px,2vw,28px)}
.paper-h{font:600 14px/1.4 var(--sans);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;color:var(--mut)}
.paper-h b{color:var(--ink);font-weight:600;overflow-wrap:anywhere}

/* Beranda */
.hero{padding-top:clamp(28px,5vw,72px);padding-bottom:clamp(40px,6vw,88px)}
.hero h1{font-size:min(8vw,128px);line-height:.98;letter-spacing:-.045em;margin-bottom:clamp(24px,4vw,56px)}
.ln{display:block;overflow:clip;overflow-clip-margin:.08em;padding-bottom:.1em;margin-bottom:-.1em}
.ln>span{display:block;white-space:nowrap}
.hero-g{display:grid;grid-template-columns:5fr 7fr;gap:clamp(24px,4vw,64px);align-items:start}
.lede{font-size:20px;line-height:1.42;max-width:30em;margin-bottom:24px}
.hero .note{margin-top:14px;max-width:32em}
.hits{display:grid;gap:2px;margin-top:14px;font:500 14px/1.4 var(--sans)}
.hit{display:flex;gap:12px;justify-content:space-between;text-align:left;background:var(--step);border:0;padding:10px 12px;color:var(--ink);transition:background var(--t-hover) ease,color var(--t-hover) ease,padding-left 300ms var(--ease-out)}
.hit span:last-child{white-space:nowrap;font-weight:600}
@media(hover:hover){.hit:hover{background:var(--marker);color:var(--on-marker);padding-left:18px}}

.chapter{padding-block:clamp(72px,11vw,168px)}
.chapter>.head{margin-bottom:clamp(28px,4vw,56px)}
.head h2,.big-h{font-size:clamp(32px,5vw,72px);letter-spacing:-.04em;line-height:1;margin-bottom:16px}
.head p{font-size:20px;color:var(--mut);max-width:34em}
.rv-line{overflow:clip;overflow-clip-margin:.08em;padding-bottom:.08em}

/* Tester dan baris kemampuan */
.split-5-7{display:grid;grid-template-columns:5fr 7fr;gap:clamp(24px,4vw,64px);align-items:start}
.in{width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:4px;background:var(--sheet);transition:border-color var(--t-hover) ease,background var(--t-hover) ease}
.in:focus{border-color:var(--ink);outline:0}
textarea.in{display:block;resize:vertical;font:17px/1.6 var(--serif);caret-color:var(--ink)}
#pgr{margin-top:18px}
#pgr>p{margin-bottom:12px}
.pgv{font:17px/1.7 var(--serif)}
.gauge{height:10px;background:var(--step);overflow:hidden;margin:6px 0 6px}
.gauge i{display:block;height:100%;background:var(--ink);transform-origin:left}
.gauge.high i{background:var(--danger)}
.statement{font-size:clamp(24px,2.5vw,36px);line-height:1.2;letter-spacing:-.02em;font-weight:500;max-width:25em;margin-bottom:clamp(48px,7vw,104px);view-timeline-name:--ink}
.frag-row{display:grid;grid-template-columns:5fr 7fr;gap:clamp(24px,4vw,64px);align-items:start;padding-bottom:clamp(48px,6vw,88px)}
.frag-row h3{font-size:clamp(22px,2.5vw,36px);letter-spacing:-.03em;margin-bottom:12px}
.frag-row>div>p{color:var(--mut);max-width:28em}
.frag{background:var(--step);padding:clamp(16px,2.4vw,32px);border-radius:4px;min-width:0}
.m{padding:10px 13px;border-radius:4px;max-width:90%;white-space:pre-wrap;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.m{width:fit-content}
.m.u{background:var(--ink);color:var(--bg);align-self:flex-end;margin-left:auto}
.m.a{background:var(--sheet);border:1px solid var(--line);align-self:flex-start}
.m.fresh{transform-origin:left bottom}
.m.u.fresh{transform-origin:right bottom}
.frag .m+.m{margin-top:8px}
.seg{display:inline-flex;gap:2px;margin-bottom:14px}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;font-size:14px;position:relative;color:var(--mut);transition:color var(--t-hover) ease}
.seg button.on{color:var(--on-marker);background:var(--marker)}
.seg .ti{position:absolute;inset:0;background:var(--marker);z-index:0;view-transition-name:seg-on}
.seg span{position:relative;z-index:1}
#kind-out ul{margin:6px 0 0;padding-left:20px;font:17px/1.6 var(--serif)}
#kind-out b{font-weight:600}

/* Akordeon arsitektur */
.acc{display:grid;gap:2px}
.acc-item{background:var(--step);padding-inline:clamp(14px,1.6vw,22px)}
.acc-b{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:clamp(14px,1.6vw,22px) 0;background:none;border:0;text-align:left;font-size:clamp(22px,2.5vw,36px);font-weight:600;letter-spacing:-.03em;line-height:1.05;transition:padding-left 400ms var(--ease-out)}
.acc-b i{flex:none;width:.5em;height:.5em;position:relative;transition:transform 360ms var(--ease-out)}
.acc-b i:before,.acc-b i:after{content:"";position:absolute;background:currentColor}
.acc-b i:before{left:0;right:0;top:calc(50% - 1px);height:2px}
.acc-b i:after{top:0;bottom:0;left:calc(50% - 1px);width:2px}
.acc-item.on .acc-b i{transform:rotate(45deg)}
@media(hover:hover){.acc-b:hover{padding-left:12px}}
.acc-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows 340ms var(--ease-out)}
.acc-p>div{overflow:hidden}
.acc-p p{padding-bottom:20px;max-width:38em}
.acc-item.on .acc-p{grid-template-rows:1fr}

/* Paket */
.plan-rows{display:grid;gap:2px}
.plan-row{display:grid;grid-template-columns:2fr 2fr 4fr auto;gap:20px;align-items:center;padding:clamp(16px,2vw,26px) clamp(14px,1.6vw,22px);background:var(--step);transition:background var(--t-ui) ease}
.plan-row h3{font-size:clamp(22px,2.5vw,36px);letter-spacing:-.025em;margin:0}
.plan-row .price{font-weight:500}
.plan-row ul{margin:0;padding:0;list-style:none;color:var(--mut);font-size:14px}
.plan-row.recommended{background:var(--marker);color:var(--on-marker)}
.plan-row.recommended ul{color:var(--on-marker)}
.plan-row .btn{min-width:150px}
.plan-row.recommended .btn{--ink:#141414;--bg:#f5f5f4}
.plan-row.recommended .btn:hover{--marker:#fff;border-color:#fff}
#paket>.note{margin-top:14px}

/* Masuk dan daftar */
.auth-g{display:grid;grid-template-columns:5fr 7fr;min-height:calc(100svh - 58px)}
.auth-f{padding:clamp(24px,5vw,72px) var(--gut);display:flex;flex-direction:column;justify-content:center}
.auth{width:100%;max-width:440px}
.auth-a{--ink:var(--field-ink);background:var(--field);color:var(--ink);padding:clamp(24px,5vw,72px);display:flex;align-items:flex-end}
.auth-a p{font:400 clamp(26px,3.4vw,50px)/1.28 var(--serif);letter-spacing:-.015em;max-width:18em}
.auth-a .mk{--on-marker:#141414}
.tabs{display:flex;gap:18px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
.tab{position:relative;background:none;border:0;padding:8px 0 10px;font-weight:600;color:var(--mut);white-space:nowrap;transition:color var(--t-hover) ease}
.tab.on{color:var(--ink)}
.tab-i{position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--marker);view-transition-name:tab-on}
label{display:block;font-size:14px;font-weight:500;margin:14px 0 5px}
.pw,.send{display:flex;gap:6px}
.pw .in,.send .in{flex:1;min-width:0}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:10px 0}
.auth h1{font-size:28px;margin-bottom:8px}

/* Ruang kerja */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:clamp(16px,1.8vw,24px);margin-bottom:14px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--sheet);border:1px solid var(--line);border-radius:4px;margin-bottom:14px}
.stats3 .card{margin:0;border:0;background:none}
.stats3 .card+.card{border-left:1px solid var(--line);border-radius:0}
.big{display:block;font-size:34px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15}
.drop{border:1px dashed var(--line2);border-radius:4px;padding:clamp(24px,4vw,44px) 14px;text-align:center;color:var(--mut);transition:background 240ms ease,border-color 240ms ease,transform 340ms var(--ease-out)}
.drop>p:first-child{margin-bottom:12px;color:var(--ink)}
.drop .note{margin-top:14px}
.drop.over{background:var(--marker);color:var(--on-marker);border-color:var(--on-marker);transform:scale(1.008)}
.drop.over>p,.drop.over .note{color:var(--on-marker)}
.li{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);transition:padding-left 300ms var(--ease-out)}
.li:first-of-type{border-top:0}
@media(hover:hover){.li:hover{padding-left:6px}}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;text-align:left;font-weight:600;padding:0}
.lg{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.lg:first-of-type{border-top:0}
.lg .t{flex:1;min-width:0}
.lg .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:12px;font-weight:500;background:var(--step);border-radius:3px;padding:2px 7px;color:var(--mut);white-space:nowrap}
.page-t{font-size:clamp(22px,2.2vw,28px);letter-spacing:-.02em;overflow-wrap:anywhere;margin:0}
.title-bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.split>div>.card:last-child{margin-bottom:0}
.docv{position:sticky;top:72px;max-height:calc(100svh - 92px);overflow:auto;margin:0}
.docv span{border-radius:1px}
.s3{margin:0 0 18px}
.s3 h3{margin:0 0 6px;font-size:14px;color:var(--mut);font-weight:500;letter-spacing:0;line-height:1.4}
.s3 ul{margin:0;padding-left:20px}
.risk{display:block;width:100%;text-align:left;background:var(--step);border:0;padding:10px 12px;margin:2px 0;color:var(--ink);transition:background var(--t-hover) ease,color var(--t-hover) ease,padding-left 300ms var(--ease-out)}
@media(hover:hover){.risk:hover{background:var(--marker);color:var(--on-marker);padding-left:18px}}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:360px;overflow-y:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line2);background:transparent;border-radius:4px;padding:5px 11px;font-size:14px;transition:background var(--t-hover) ease,border-color var(--t-hover) ease,color var(--t-hover) ease,transform var(--t-press) var(--ease-out)}
.chip:active{transform:scale(.97)}
@media(hover:hover){.chip:hover{background:var(--marker);border-color:var(--marker);color:var(--on-marker)}}
.wa{display:grid;gap:14px}
.wa .card{margin:0}
.qr{display:grid;grid-template-columns:repeat(21,1fr);width:176px;aspect-ratio:1;background:#fff;padding:8px;margin:12px 0}
.qr i{background:#fff}.qr i.k{background:#111}
.thinking{font-size:14px;color:var(--mut)}

/* Tampilan proses */
#proc{position:fixed;inset:0;background:rgba(10,10,10,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.pbox{background:var(--sheet);border-radius:4px;box-shadow:0 18px 60px rgba(0,0,0,.28);padding:22px;width:min(400px,100%)}
.pbox ul{list-style:none;margin:14px 0;padding:0;font:16px/1.9 var(--serif)}
.pbox li{color:var(--mut);transition:color 240ms ease}
.pbox li span{padding:.05em .1em;margin-inline:-.1em;background-image:linear-gradient(var(--marker),var(--marker));background-repeat:no-repeat;background-position:0 62%;background-size:0 84%;transition:background-size 340ms var(--ease-in-out)}
.pbox li.on,.pbox li.ok{color:var(--on-marker)}
:root[data-theme="dark"] .pbox li.ok{color:var(--on-marker)}
.pbox li.on span,.pbox li.ok span{background-size:100% 84%}
.bar2{height:6px;background:var(--step);overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform 340ms var(--ease-out)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transform:translate(-50%,14px);transition:opacity 220ms ease,transform 380ms var(--ease-out);z-index:30;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){
  .hero-g,.split,.split-5-7,.frag-row,.auth-g{grid-template-columns:1fr}
  .auth-a{display:none}
  .docv{position:static;max-height:300px}
  .scene-stage{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);align-items:start;gap:14px;padding-block:20px}
  .scene-doc{align-self:stretch;height:100%;grid-template-rows:minmax(0,1fr) auto;overflow:clip}
  .scene-doc .paper{font-size:14px;line-height:1.55;padding:14px;overflow:clip;min-height:0}
  .steps h3{margin-bottom:8px}
  .plan-row{grid-template-columns:1fr auto;gap:6px 14px}
  .plan-row ul{grid-column:1/-1}
  .plan-row .btn{grid-column:1/-1;width:100%;margin-top:8px}
  .plan-row .price{text-align:right}
}
@media(max-width:640px){
  #burger{display:inline-flex}
  .ai-pill{display:none}
  .links{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);padding:10px var(--gut) 16px;box-shadow:0 12px 24px rgba(0,0,0,.14);flex-direction:column;align-items:stretch;transform-origin:top right}
  .links.open{display:flex}
  .links .btn{width:100%}
  .stats3{grid-template-columns:1fr}
  .stats3 .card+.card{border-left:0;border-top:1px solid var(--line)}
  .li{flex-wrap:wrap}.nm{flex-basis:100%}
}

/* Semua keadaan tersembunyi hanya ada di sini; tanpa gerak, tampilannya sudah selesai */
@media(prefers-reduced-motion:no-preference){
  html.js .rv{opacity:0;transform:translateY(24px)}
  html.js .rv.is-in{opacity:1;transform:none;transition:opacity 600ms ease calc(var(--i,0)*var(--stagger)),transform var(--t-reveal) var(--ease-expo) calc(var(--i,0)*var(--stagger))}
  html.js .rv-line>span{transform:translateY(106%)}
  html.js .rv-line.is-in>span{transform:none;transition:transform 1000ms var(--ease-expo) calc(var(--i,0)*90ms)}
  html.js .rv-open{clip-path:inset(0 100% 0 0)}
  html.js .rv-open.is-in{clip-path:inset(0);transition:clip-path 1100ms var(--ease-in-out)}
  html.js .rv-row{opacity:0;transform:translateX(-18px)}
  html.js .rv-row.is-in{opacity:1;transform:none;transition:opacity 480ms ease calc(var(--i,0)*var(--stagger)),transform 640ms var(--ease-out) calc(var(--i,0)*var(--stagger))}

  @keyframes line-up{from{transform:translateY(106%)}to{transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes sweep{from{background-size:0 84%}to{background-size:100% 84%}}
  @keyframes sweep-ink{from{background-size:0 84%;color:var(--ink)}60%{color:var(--ink)}to{background-size:100% 84%;color:var(--on-marker)}}
  @keyframes grow{from{transform:scaleX(0)}to{transform:none}}
  @keyframes open-x{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
  @keyframes fresh{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes menu{from{opacity:0;transform:scale(.97) translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .enter .hero h1 .ln>span{animation:line-up 1000ms var(--ease-expo) both;animation-delay:calc(var(--i,0)*90ms)}
  .enter .hero-t{animation:rise 800ms var(--ease-expo) 240ms both}
  .enter .hero-doc{animation:open-x 1100ms var(--ease-in-out) 120ms both}
  .enter .hero-doc .mk,.enter .docv .mk,.enter .auth-a .mk{animation:sweep-ink 760ms var(--ease-in-out) both;animation-delay:calc(var(--k,0)*170ms + 720ms)}
  .enter .rise{animation:rise 620ms var(--ease-out) both;animation-delay:calc(var(--i,0)*var(--stagger))}
  .enter .li,.enter .lg{animation:rise 520ms var(--ease-out) both;animation-delay:calc(var(--i,0)*55ms + 120ms)}
  .enter .gauge i,.pg-in .gauge i{animation:grow 1000ms var(--ease-expo) 300ms both}
  .pg-in .mk{animation:sweep-ink 620ms var(--ease-in-out) both;animation-delay:calc(var(--k,0)*130ms + 140ms)}
  .pg-in>p,.pg-in .pgv{animation:fade 420ms ease both}
  .m.fresh{animation:fresh 420ms var(--ease-out) both}
  .fl{animation:sweep 620ms var(--ease-in-out) both}
  .links.open{animation:menu var(--t-ui) var(--ease-out)}
  #proc{animation:fade 200ms ease both}
  .pbox{animation:pop 340ms var(--ease-out) both}
  .qr{animation:open-x 620ms var(--ease-in-out) both}
  .kind-in{animation:rise 420ms var(--ease-out) both}


  /* Perpindahan antar-halaman */
  ::view-transition-old(root){animation:vt-out 180ms var(--ease-out) both}
  ::view-transition-new(root){animation:vt-in 420ms var(--ease-out) both}
  @keyframes vt-out{to{opacity:0}}
  @keyframes vt-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  ::view-transition-group(site-header){animation:none}
  ::view-transition-old(site-header){display:none}
  ::view-transition-new(site-header){animation:none}
  ::view-transition-group(tab-on),::view-transition-group(seg-on){animation-duration:420ms;animation-timing-function:var(--ease-in-out)}
  ::view-transition-group(doc-title){animation-duration:560ms;animation-timing-function:var(--ease-in-out)}
  ::view-transition-old(doc-title),::view-transition-new(doc-title){height:100%;object-fit:none;object-position:left center}
}

/* Tumpukan dokumen */
.deal{background:var(--step);position:relative}
.deal-stage{display:grid;grid-template-columns:7fr 5fr;gap:clamp(24px,4vw,64px);align-items:center;padding:clamp(40px,6vw,96px) var(--gut)}
.deal-t h2{font-size:16px;font-weight:500;letter-spacing:0;color:var(--mut);margin-bottom:10px}
.deal-words{display:grid;overflow:clip;overflow-clip-margin:.06em;font-size:min(13vw,190px);font-weight:600;letter-spacing:-.05em;line-height:1.02;margin:0;list-style:none;padding:0}
.deal-words li{grid-area:auto}
.deal-t p{font-size:20px;line-height:1.4;max-width:24em;margin-top:18px}
.sheets{display:grid;gap:12px;min-width:0}
.sheet{background:#f7f7f6;color:#141414;padding:clamp(18px,2vw,30px);border-radius:3px;font:400 17px/1.55 var(--serif);min-height:clamp(240px,50svh,460px);display:flex;flex-direction:column;gap:14px}
.sheet b{font:600 clamp(20px,1.9vw,26px)/1.15 var(--sans);letter-spacing:-.02em}
.sheet small{font:500 14px/1.3 var(--sans);color:#5c5c58;margin-top:auto}
.sheet .mk{--on-marker:#141414}
.deal.is-live{height:calc((var(--hold,3) + 1)*100svh)}
.deal.is-live .deal-stage{position:sticky;top:0;height:100svh;overflow:clip;padding-block:24px}
.deal.is-live .deal-words li{grid-area:1/1}
.deal.is-live .sheets{display:block;position:relative;height:min(62svh,520px)}
.deal.is-live .sheet{position:absolute;inset:0;box-shadow:0 14px 40px rgba(0,0,0,.2);will-change:transform}

/* Baca, sorot, tanya */
.walk{--ink:var(--field-ink);--mut:var(--field-mut);background:var(--field);color:var(--ink);position:relative}
.walk-stage{display:grid;grid-template-columns:5fr 7fr;gap:clamp(24px,4vw,64px);align-items:center;padding:clamp(48px,7vw,96px) var(--gut)}
.walk-t{display:grid;gap:18px;align-content:center;min-width:0}
.walk-t h2{font-size:16px;font-weight:500;letter-spacing:0;margin:0;color:var(--mut)}
.steps{display:grid;gap:32px;list-style:none;margin:0;padding:0}
.steps h3{font-size:clamp(52px,8vw,128px);letter-spacing:-.05em;line-height:1;margin-bottom:14px;overflow:clip;overflow-clip-margin:.06em}
.steps h3 span{display:block}
.steps p{font-size:20px;line-height:1.4;max-width:24em}
.walk-doc{--ink:#141414;--mut:#5c5c58;--sheet:#f7f7f6;--line:#f7f7f6;--bg:#f7f7f6;color:var(--ink);display:grid;gap:10px;min-width:0}
.qa{background:var(--sheet);border-radius:4px;padding:14px 16px;font-size:14px;line-height:1.45;display:grid;gap:8px}
.qa b{font-weight:600}
.src{display:inline-block;font:600 14px/1.3 var(--sans);background:var(--marker);color:var(--on-marker);padding:3px 8px;border:0;border-radius:2px;justify-self:start;transition:transform var(--t-press) var(--ease-out)}
.src:active{transform:scale(.97)}
.walk.is-live{height:calc((var(--hold,3) + 1)*100svh)}
.walk.is-live .walk-stage{position:sticky;top:0;height:100svh;overflow:clip;padding-block:clamp(20px,4vw,56px)}
.walk.is-live .steps>li{grid-area:1/1}
.walk.is-live .walk-doc .paper{will-change:transform}

/* Baris besar yang didorong scroll */
.pushed{overflow:clip;font-size:clamp(56px,11vw,176px);font-weight:600;letter-spacing:-.05em;line-height:1.05;white-space:nowrap;padding-block:clamp(8px,2vw,24px) clamp(56px,8vw,120px)}
.pushed span{display:inline-block;will-change:transform}

/* Penutup: goresan stabilo memenuhi layar */
.finale{position:relative}
.finale-dark{display:none}
.finale-fill{background:var(--marker);color:var(--on-marker);padding:clamp(48px,7vw,96px) var(--gut) clamp(16px,2vw,28px);overflow:clip;--ink:#141414;--bg:#f5f5f4}
.finale-fill h2{font-size:clamp(32px,5vw,72px);letter-spacing:-.04em;margin-bottom:12px}
.finale-fill>p:not(.wordmark){font-size:20px;margin-bottom:22px}
.finale-fill .btn:hover{--marker:#fff;border-color:#fff}
.finale .wordmark{font-size:11.2vw;font-weight:700;letter-spacing:-.05em;line-height:1;white-space:nowrap;margin-top:clamp(40px,7vw,104px);overflow:clip;overflow-clip-margin:.06em}
.wordmark i{display:inline-block;font-style:normal;white-space:pre}
.finale.is-live{height:calc((var(--hold,2) + 1)*100svh)}
.finale.is-live .finale-stage{position:sticky;top:0;height:100svh;overflow:clip;background:var(--bg)}
.finale.is-live .finale-dark{display:flex;align-items:center;position:absolute;inset:0;padding:var(--gut);font-size:clamp(34px,6.4vw,104px);font-weight:600;letter-spacing:-.04em;line-height:1.02}
.finale.is-live .finale-fill{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding-bottom:clamp(16px,2vw,28px)}
.finale.is-live .wordmark{margin-top:clamp(24px,5vw,72px)}

/* Lain-lain */
#prog{position:fixed;left:0;right:0;top:0;height:5px;background:var(--marker);transform:scaleX(0);transform-origin:left;z-index:12;pointer-events:none}
#wipe{position:fixed;inset:0;background:var(--marker);transform:scaleX(0);z-index:40;pointer-events:none}
.btn{translate:var(--mx,0) var(--my,0);transition:color var(--t-hover) ease,border-color var(--t-hover) ease,transform var(--t-press) var(--ease-out),translate 420ms var(--ease-out)}
.hit.on{background:var(--marker);color:var(--on-marker);padding-left:18px}
.hero-doc{perspective:1400px}
.hero-doc .paper{will-change:transform}
.rv-words{overflow:visible;padding-bottom:0}
.wd{display:inline-block;overflow:clip;overflow-clip-margin:.08em;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.wd>span{display:inline-block}
.in:not(textarea){background-image:linear-gradient(var(--marker),var(--marker));background-repeat:no-repeat;background-position:0 100%;background-size:0 4px;transition:border-color var(--t-hover) ease,background-size 420ms var(--ease-out)}
.in:not(textarea):focus{background-size:100% 4px}
.li{position:relative;isolation:isolate}
.li:before{content:"";position:absolute;inset:0 -8px;background:var(--step);z-index:-1;transform:scaleX(0);transform-origin:left;transition:transform 420ms var(--ease-out)}
@media(hover:hover){.li:hover:before{transform:scaleX(1)}.plan-row:hover h3{transform:translateX(10px)}}
.plan-row h3{transition:transform 420ms var(--ease-out)}
.thinking:after{content:"";display:inline-block;width:1.4em;height:.5em;margin-left:6px;background:var(--marker);transform-origin:left}

@media(max-width:900px){
  .deal-stage,.walk-stage{grid-template-columns:1fr;gap:18px}
  .deal.is-live .deal-stage{grid-template-rows:auto minmax(0,1fr);align-items:start}
  .deal.is-live .sheets{height:100%;max-height:56svh}
  .walk.is-live .walk-stage{grid-template-rows:auto minmax(0,1fr);align-items:start;gap:14px;padding-block:20px}
  .walk.is-live .walk-doc{align-self:stretch;height:100%;grid-template-rows:minmax(0,1fr) auto;overflow:clip}
  .walk-doc .paper{font-size:14px;line-height:1.55;padding:14px;overflow:clip;min-height:0}
  .steps h3{margin-bottom:8px}
}

@media(prefers-reduced-motion:no-preference){
  html.js .rv-words .wd>span{transform:translateY(110%)}
  html.js .rv-words.is-in .wd>span{transform:none;transition:transform 900ms var(--ease-expo) calc(var(--i,0)*70ms)}
  .enter .hit{animation:slide-r 620ms var(--ease-out) both;animation-delay:calc(var(--k,0)*90ms + 620ms)}
  @keyframes slide-r{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes slide-l{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
  .enter .rise{animation:rise-big 760ms var(--ease-expo) both;animation-delay:calc(var(--i,0)*90ms)}
  @keyframes rise-big{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:none}}
  .enter .split>.docv{animation:slide-l 820ms var(--ease-expo) both}
  .enter .s3{animation:slide-r 620ms var(--ease-out) both}
  .enter .s3:nth-of-type(1){animation-delay:120ms}.enter .s3:nth-of-type(2){animation-delay:190ms}.enter .s3:nth-of-type(3){animation-delay:260ms}.enter .s3:nth-of-type(4){animation-delay:330ms}.enter .s3:nth-of-type(5){animation-delay:400ms}
  .enter .risk{animation:slide-r 520ms var(--ease-out) both;animation-delay:calc(var(--i,0)*70ms + 360ms)}
  .enter .auth>*{animation:rise-big 700ms var(--ease-expo) both}
  .enter .auth-a{animation:open-x 900ms var(--ease-in-out) both}
  .enter .card h2{animation:fade 500ms ease 140ms both}
  .lit{animation:sweep 720ms var(--ease-in-out) both}
  .thinking:after{animation:grow 900ms var(--ease-in-out) infinite alternate}
  .err:not(:empty){animation:nudge 340ms var(--ease-out)}
  @keyframes nudge{0%{transform:translateX(-8px)}50%{transform:translateX(5px)}100%{transform:none}}

  /* Proses layar penuh: nama langkah naik satu per satu */
  #proc{background:var(--field);align-items:stretch;padding:0}
  .pbox{--ink:var(--field-ink);background:none;box-shadow:none;width:100%;border-radius:0;padding:var(--gut);display:flex;flex-direction:column;justify-content:flex-end;color:var(--field-ink)}
  .pbox b{font-weight:500;color:var(--field-mut)}
  .pbox ul{display:grid;overflow:clip;font:600 clamp(36px,8vw,128px)/1.08 var(--sans);letter-spacing:-.045em;margin:10px 0 22px}
  .pbox li{grid-area:1/1;color:var(--field-ink)!important;transform:translateY(112%);transition:transform 340ms var(--ease-in-out)}
  .pbox li span{background:none;padding:0;margin:0}
  .pbox li.on{transform:none}
  .pbox li.ok{transform:translateY(-112%)}
  .bar2{height:12px;background:#2c2c2c}
  .bar2 i{background:var(--marker)}

  /* Geser antar-tab sesuai arah */
  html[data-dir="next"]::view-transition-old(root){animation:tab-out-l 220ms var(--ease-out) both}
  html[data-dir="next"]::view-transition-new(root){animation:tab-in-r 460ms var(--ease-out) both}
  html[data-dir="prev"]::view-transition-old(root){animation:tab-out-r 220ms var(--ease-out) both}
  html[data-dir="prev"]::view-transition-new(root){animation:tab-in-l 460ms var(--ease-out) both}
  @keyframes tab-out-l{to{opacity:0;transform:translateX(-48px)}}
  @keyframes tab-out-r{to{opacity:0;transform:translateX(48px)}}
  @keyframes tab-in-r{from{opacity:0;transform:translateX(64px)}}
  @keyframes tab-in-l{from{opacity:0;transform:translateX(-64px)}}
}

/* Arah baru: satu kotak stabilo. Tiap bab satu warna penuh, huruf poster, tanpa sudut membulat. */
:root{
  --yellow:#ffe14d;--pink:#ff5fa2;--green:#39e58c;--orange:#ff7a1f;--blue:#38c6ff;--black:#141414;
  --bg:#ffffff;--sheet:#ffffff;--step:#efefec;--ink:#141414;--mut:#4f4f4b;--line:#efefec;--line2:#141414;
  --marker:var(--yellow);--on-marker:#141414;--field:#141414;--field-ink:#ffffff;--field-mut:#c9c9c4;
  --display:"Anton","Arial Narrow",Impact,sans-serif;--sans:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{--bg:#141414;--sheet:#1f1f1f;--step:#262626;--ink:#f4f4f2;--mut:#b5b5b0;--line:#262626;--line2:#f4f4f2;--field:#000000}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--sheet:#1f1f1f;--step:#262626;--ink:#f4f4f2;--mut:#b5b5b0;--line:#262626;--line2:#f4f4f2;--field:#000000}}
body{font-weight:500}
h1,h2,h3,.big-h,.page-t,.big,.acc-b,.deal-words,.steps h3,.pushed,.wordmark,.price,.tab,.finale-dark{font-family:var(--display)!important;font-weight:400!important;letter-spacing:.005em!important;text-transform:uppercase}
h2{font-size:30px;line-height:1.05}

/* Tombol: padat, persegi, huruf poster */

.btn.sm{padding:9px 14px;font-size:15px}

@media(hover:hover){.btn:hover,.btn:focus-visible{color:#141414}.btn.ghost:hover,.btn.ghost:focus-visible{box-shadow:none}.btn.danger:hover,.btn.danger:focus-visible{color:#fff;box-shadow:none}}

/* Tumpukan dokumen */

 else if(a==="logout"){S.waS=null;S.waLink=null;stopWaPoll();fetch("/api/logout",{method:"POST",headers:{"X-CSRF-Token":csrfToken}}).then(r=>r.json()).then(d=>{csrfToken=d.csrf||""}).catch(()=>{csrfToken=""}).finally(()=>{S.user=null;S.docs=[];S.log=[];S.wa={num:"",on:true};S.cur=null;wipe(()=>{S.view="home";render();toTop()});toast("Kamu sudah keluar")})}
 else if(a==="demo"){if(S.view!=="home"){S.view="home";S.enter=true;render()}glide($("#coba"))}

 else if(a==="waqr"){const c=$("#wa-consent");if(c&&!c.checked)return toast("Centang persetujuan dulu");post("/api/whatsapp/link",{consent:true}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||"QR gagal dibuat");S.waLink=d;paintWA();stopWaPoll();waPoll=setInterval(()=>{if(S.view!=="ws"||S.tab!=="wa")return stopWaPoll();loadWA()},4000)}).catch(e=>toast(e.message))}

 else if(a==="ask")ask(arg,"Web");
